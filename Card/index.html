<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advertisement Card</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&family=Oswald:wght@200..700&display=swap');

        body {
            background-color: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        
        .box {
            background-color: white;
            width: 350px;
            border-radius: 10px;
            margin: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }

        .image {
            width: 100%;
            margin-bottom: 10px;
        }

        .image img {
            width: 100%;
            border-radius: 8px;
            display: block;
        }

        .capsules {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .capsule {
            border-radius: 15px;
            border: 2px solid grey;
            padding: 4px 12px;
            color: grey;
            font-size: 14px;
            font-weight: bold;
        }

        .content {
            margin: 0;
            padding: 0;
            text-align: left;
            width: 100%;
            margin-bottom: 15px;
        }

        .content h1 {
            margin: 0;
            padding: 0;
            text-align: left;
            font-size: 24px;
            color: #333;
        }

        .content p {
            margin-top: 10px;
            margin-bottom: 0;
            padding: 0;
            text-align: left;
            font-family: Arial, sans-serif;
            color: #666;
            line-height: 1.4;
        }

        
        .read-more-btn {
            display: flex;
            align-self: center; 
            background-color: skyblue;
            color: blue;
            padding: 8px 20px; 
            border-radius: 20px; 
            
            font-weight: bold;
            font-size: 14px;
            
        }

        .read-more-btn:hover {
            background-color: #004b99;
        }
    </style>
</head>
<body>

    <div class="box">
        <div class="image">
            <img src="card_image.jfif" alt="Logo of advertisement">
        </div>
        
        <div class="capsules">
            <div class="capsule">Nature</div>
            <div class="capsule">Lake</div>
        </div>

        <div class="content">
            <h1>Advertisement</h1>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Debitis assumenda modi error vero, eveniet molestiae amet neque ex blanditiis dicta qui fuga sunt!</p> 
        </div>

        <!-- Short Centered Read More Button -->
        <a href="https://www.wikipedia.org" target="_blank" class="read-more-btn">Read More</a>
    </div>

</body>
</html>
