<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
 body{ 
    color: red;
    background-color: yellow;
 }
 @media only screen and (max-width: 400px) {
    body{
        background-color: antiquewhite;
        color : black;
    }
    .boxes{
        flex-direction: column;
    }
 }

    body{
        background-color: hotpink;
        color : aqua;
    }
    .boxes{
        flex-direction: column;
    }
 }
 .boxes{
    display: flex;

 }
 .box{
    width: 100px;
    height: 100px;
    background-color: blue;
    margin: 10px;
    padding: 10px;
 }
    </style>
</head>
<body>
    <div> Hey , this program made to learn about Media Queries.</div>

    </div>
</body>
</html>
