<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            width: 300px;
            height: 30px;
            background-color: red;
            box-shadow: 10px 10px 20px blue;
            margin-bottom: 25px;
            outline: 2px solid black;
        }
        .text-shadow{
            text-shadow: 2px 2px 5px blue;
        }
    </style>
</head>
<body>
    <div class = "box"> I am a box</div>
    <p class = "text-shadow">Lorem ipsum dolor sit amet consectetur adipisicing elit. Reprehenderit rem exercitationem quasi delectus quod quaerat ipsam! Veritatis enim iusto animi ipsa cupiditate, quod natus? Facilis maiores repellat unde earum eius quibusdam odio ratione nemo!</p> 
</body>
</html>
