<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            background-color: black;
        }
    nav{
        background-color: deeppink;
        height: 80px;
        
    }
    
    .container{
        background-color: green;
        height: 300px;
        width: 700px;
        margin: 20px auto;
        padding: 40px;

        gap: 60px;
    }
    .box1{
        background-color: hotpink;
         margin: 30px 40px ;

        width:250px;
    }
    .box2{

        padding: 0px 35px; 
        height :250px;
        width:250px;
    }
    footer{

    }
    .box3{
        position:relative;

        height:240px;
        width:500px;
        border-radius: 20px;
        border: 2px solid grey;
        color:grey;

    .dot{
        position:absolute;
        top:-5px;
        right:-40px;
        width:40px;
        height:40px;
        border-radius: 60px;
        background-color: orange;
        /* justify-content: flex-end; */

    }

</head>
<body>
    <header>
    <nav>
     </nav>
    </header>
    <main>
     <div class = "container">

     </div>
    </main>

      <div class="box3">Welcome to My GIT HUB Profile.
