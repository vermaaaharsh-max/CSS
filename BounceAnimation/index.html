<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title> Bounce Animation </title>
    <style>
     .box{
        height: 120px;
        width: 120px;
        background-color: cornflowerblue;
        border-radius: 70px;
        position:absolute;
        bottom: 0;
        left: 0;
        animation: AnimationHV 3s linear infinite , AnimationH 1s ease-out infinite alternate;
     }
     .container{
        position:relative;
        height: 80vh;
        width: 80vw;
        background-color: darkslategray;
     }
     @keyframes AnimationHV {
        from{
        left: 0;
        }
        to{
        left: 100%;
        }
    }
        @keyframes AnimationH {
            from{
                bottom:0;
            }
            to{
                bottom:100%;
            }
        }
     
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>
